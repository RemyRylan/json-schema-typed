name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generated files are up to date
        run: git diff --exit-code
      - run: npm test
      - run: npm run check

  oldest-typescript:
    # The published declarations must compile on the oldest TypeScript we
    # support (4.7 is the first with NodeNext resolution).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx -y -p typescript@4.7 tsc -p tsconfig.floor.json
